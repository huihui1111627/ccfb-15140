[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gcsim"
version = "1.0.0"
description = "Generational GC simulator, parameter tuner and GC-log calibrator"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# scipy makes the vectorised survival kernels faster; a NumPy fallback exists.
fast = ["scipy>=1.7"]
test = ["pytest>=7"]

[project.scripts]
gcsim = "gcsim.cli:main"

[tool.setuptools.packages.find]
include = ["gcsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
